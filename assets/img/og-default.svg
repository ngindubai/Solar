<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- Journey line motif: one line off the mark, forking into two paths -->
  <circle cx="160" cy="150" r="52" fill="#f4b942" stroke="#0d0d0d" stroke-width="8"/>
  <path d="M160 230 v 60 c 0 60 -60 40 -60 120 v 80" fill="none" stroke="#0d0d0d" stroke-width="16" stroke-linecap="round"/>
  <path d="M160 230 v 60 c 0 60 60 40 60 120 v 80" fill="none" stroke="#0d0d0d" stroke-width="16" stroke-linecap="round"/>
  <text x="320" y="185" font-family="Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" fill="#0d0d0d" letter-spacing="-2">Your DEWA bill</text>
  <text x="320" y="275" font-family="Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" fill="#0d0d0d" letter-spacing="-2">is optional.</text>
  <text x="320" y="360" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#3c3c3c">Solar &amp; battery storage for Dubai homes and businesses.</text>
  <text x="320" y="410" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="400" fill="#3c3c3c">Free with a PPA, or own your system, from AED 0 upfront.</text>
  <!-- Monochrome DEWA band ramp -->
  <rect x="320" y="480" width="180" height="16" rx="8" fill="#dcdcd7"/>
  <rect x="516" y="480" width="180" height="16" rx="8" fill="#a9a9a2"/>
  <rect x="712" y="480" width="180" height="16" rx="8" fill="#5e5e58"/>
  <rect x="908" y="480" width="180" height="16" rx="8" fill="#0d0d0d"/>
  <text x="320" y="540" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#0d0d0d">{{BRAND_NAME}} · Business Bay, Dubai</text>
</svg>
